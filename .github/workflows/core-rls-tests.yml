name: Core RLS integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci && npm run build
        working-directory: email-worker
      - run: node --test tests/core-rls-integration.test.mjs
      - run: node --test tests/core-table-grants.test.mjs
      - run: node --test tests/email-delivery-claim-integration.test.mjs
